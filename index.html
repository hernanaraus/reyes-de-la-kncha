<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reyes de la Kncha | Liga Anual y Proyección TV - Tiempo Fuera</title>

  <!-- Configuración PWA (App Instalable Android / iOS) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ff4d00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reyes Kncha" />
  <link id="appleTouchIcon" rel="apple-touch-icon" href="logo-reyes.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #09090b;
      --bg-card: rgba(20, 20, 24, 0.92);
      --orange-main: #ff4d00;
      --orange-glow: rgba(255, 77, 0, 0.45);
      --gold-chosen: #facc15;
      --green-win: #22c55e;
      --red-alert: #ef4444;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.12);
      --header-height: 94px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: var(--header-height);
    }

    body.tv-mode {
      padding-top: 0;
      overflow: hidden;
      user-select: none;
    }

    .street-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 85% 20%, rgba(255, 77, 0, 0.25) 0%, transparent 48%),
        radial-gradient(circle at 15% 80%, rgba(255, 77, 0, 0.16) 0%, transparent 52%),
        linear-gradient(180deg, rgba(9, 9, 11, 0.78) 0%, rgba(9, 9, 11, 0.97) 100%),
        url('https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    }

    /* Pantalla de Login */
    .auth-gate {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background: rgba(9, 9, 11, 0.92);
      backdrop-filter: blur(16px);
    }

    .auth-card {
      background: #141418;
      border: 1px solid rgba(255, 77, 0, 0.45);
      border-top: 5px solid var(--orange-main);
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      padding: 2.25rem 2rem;
      text-align: center;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.85);
    }

    .auth-card h2 {
      font-family: 'Anton', sans-serif;
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0.75rem 0 0.4rem;
    }

    .btn-google-login {
      width: 100%;
      background: #ffffff;
      color: #09090b;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 0.98rem;
      padding: 0.85rem 1.2rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.4rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-google-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
    }

    /* Header Fijo Superior (Escritorio) */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 2rem;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(9, 9, 11, 0.95);
      backdrop-filter: blur(14px);
      gap: 1rem;
      z-index: 1000;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.75);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      cursor: pointer;
    }

    .logo-rk-img {
      height: 68px;
      width: auto;
      object-fit: contain;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 10px rgba(255, 77, 0, 0.35));
      transition: transform 0.2s ease;
    }

    .logo-rk-img:hover { transform: scale(1.03); }

    .rk-subtitle {
      font-family: 'Oswald', sans-serif;
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-left: 2px solid var(--orange-main);
      padding-left: 0.75rem;
    }

    .brand-right {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .tf-credit-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-tv-launch {
      background: linear-gradient(135deg, #ff4d00 0%, #ff7b00 100%);
      color: #000;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border: none;
      padding: 0.58rem 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      box-shadow: 0 0 18px rgba(255, 77, 0, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-tv-launch:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255, 77, 0, 0.7);
    }

    .created-by-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      font-weight: 700;
      text-align: right;
      line-height: 1.25;
    }

    .logo-tf-img {
      height: 74px;
      width: auto;
      object-fit: contain;
      filter:
        drop-shadow(0 0 2px #ffffff)
        drop-shadow(0 0 2px #ffffff)
        drop-shadow(0 0 12px rgba(255, 255, 255, 0.75));
      transition: transform 0.2s ease;
    }

    main {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.75rem 1.25rem;
      flex: 1;
    }

    .hidden { display: none !important; }

    /* Botones generales */
    .btn-primary {
      background: var(--orange-main);
      color: #000;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      padding: 0.75rem 1.35rem;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--orange-glow);
    }

    .btn-gold {
      background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
      color: #000;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border: none;
      padding: 0.62rem 1.05rem;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(250, 204, 21, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 0.58rem 0.95rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.83rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .btn-secondary:hover { background: rgba(255, 255, 255, 0.18); }

    .btn-success {
      background: var(--green-win);
      color: #000;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border: none;
      padding: 0.75rem 1.35rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-danger {
      background: rgba(220, 38, 38, 0.18);
      color: #f87171;
      border: 1px solid rgba(220, 38, 38, 0.4);
      padding: 0.58rem 0.95rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.83rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .btn-danger-solid {
      background: #dc2626;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border: none;
      padding: 0.75rem 1.35rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-second-chance {
      background: rgba(255, 193, 7, 0.16);
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.45);
      padding: 0.42rem 0.75rem;
      border-radius: 7px;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    /* VISTA 1: LANDING / INICIO */
    .hero { text-align: center; margin-bottom: 1.75rem; }

    .hero-tag {
      display: inline-block;
      background: var(--orange-main);
      color: #000;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 0.22rem 0.9rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transform: skewX(-10deg);
      margin-bottom: 0.6rem;
    }

    .hero h1 {
      font-family: 'Anton', sans-serif;
      font-size: clamp(2.1rem, 5vw, 3.6rem);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1.05;
    }

    .hero h1 .highlight { color: var(--orange-main); display: block; }

    .brush-line {
      width: 200px;
      height: 5px;
      background: var(--orange-main);
      margin: 0.7rem auto 0;
      border-radius: 50% 20% / 10% 40%;
      box-shadow: 0 0 15px var(--orange-glow);
    }

    .stop-setup-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 5px solid var(--orange-main);
      border-radius: 12px;
      padding: 1.35rem;
      margin-bottom: 1.75rem;
    }

    .stop-setup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .stop-setup-header h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.25rem;
      text-transform: uppercase;
    }

    .status-pill {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.28rem 0.75rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      align-items: end;
    }

    .input-group label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .input-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 0.72rem 0.95rem;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .input-group input:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--orange-main);
    }

    .section-label {
      font-family: 'Oswald', sans-serif;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.9rem;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .cat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 1.35rem;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cat-card:hover {
      border-color: var(--orange-main);
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(255, 77, 0, 0.22);
    }

    .cat-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--orange-main), #ff8800);
    }

    .cat-card.chosen-card {
      border-color: rgba(250, 204, 21, 0.45);
      background: linear-gradient(145deg, rgba(30, 26, 14, 0.94), rgba(18, 18, 22, 0.95));
      margin-bottom: 1.75rem;
    }

    .cat-card.chosen-card::before {
      background: linear-gradient(90deg, #facc15, #ff8800);
    }

    .cat-badge {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--orange-main);
      letter-spacing: 1px;
      margin-bottom: 0.35rem;
    }

    .cat-title {
      font-family: 'Anton', sans-serif;
      font-size: 1.8rem;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .cat-rules {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 1.1rem;
    }

    .cat-winner-tag {
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
    }

    .cat-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .cat-enter { color: var(--orange-main); }

    .db-panel {
      background: rgba(15, 15, 18, 0.92);
      border: 1px dashed rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .operators-panel {
      background: rgba(18, 22, 28, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-left: 5px solid #38bdf8;
      border-radius: 12px;
      padding: 1.25rem 1.4rem;
      margin-bottom: 1.25rem;
    }

    .operators-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 0.85rem;
    }

    .op-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #e0f2fe;
      padding: 0.38rem 0.75rem;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .op-chip.admin-chip {
      background: rgba(255, 77, 0, 0.16);
      border-color: rgba(255, 77, 0, 0.45);
      color: #ffedd5;
    }

    /* VISTA 2: PANEL DE COMPETENCIA */
    .comp-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .comp-title-box h2 {
      font-family: 'Anton', sans-serif;
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--orange-main);
      line-height: 1.05;
    }

    .comp-title-box p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    /* Banner Reglas Rápidas */
    .quick-rules-banner {
      background: rgba(15, 15, 18, 0.94);
      border: 2px solid var(--orange-main);
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      margin-bottom: 1.35rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      box-shadow: 0 6px 20px rgba(255, 77, 0, 0.15);
    }

    .quick-rules-title {
      font-family: 'Anton', sans-serif;
      font-size: 1.35rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-right: 2px solid var(--orange-main);
      padding-right: 1rem;
      line-height: 1.05;
    }

    .quick-rules-list {
      font-family: 'Oswald', sans-serif;
      font-size: 0.92rem;
      color: #e2e8f0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.45;
      flex: 1;
    }

    .quick-rules-list span {
      color: var(--orange-main);
      font-weight: 700;
    }

    /* Panel Death Time (20 Segundos) */
    .death-time-box {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.22) 0%, rgba(20, 20, 24, 0.96) 100%);
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 1rem 1.15rem;
      margin-bottom: 1.15rem;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.28);
    }

    .death-time-box.paused-dt {
      border-color: var(--gold-chosen);
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.14) 0%, rgba(20, 20, 24, 0.96) 100%);
      box-shadow: none;
    }

    .dt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .dt-digits {
      font-family: 'Anton', sans-serif;
      font-size: 2.6rem;
      color: #ef4444;
      line-height: 1;
      letter-spacing: 2px;
    }

    .death-time-box.paused-dt .dt-digits {
      color: var(--gold-chosen);
    }

    .dt-wo-actions {
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .comp-grid {
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 920px) {
      .comp-grid { grid-template-columns: 1fr; }
    }

    .panel-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .panel-box.finalists-box {
      border: 1px solid rgba(255, 77, 0, 0.55);
      box-shadow: 0 8px 26px rgba(255, 77, 0, 0.14);
    }

    .panel-box.import-box {
      border: 1px solid rgba(250, 204, 21, 0.35);
      background: rgba(24, 22, 16, 0.9);
    }

    .panel-box h3 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.15rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .reg-stack {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-bottom: 1rem;
      position: relative;
    }

    .reg-stack input, .add-row input, .add-row select {
      width: 100%;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      min-width: 0;
    }

    .reg-stack input:focus {
      outline: none;
      border-color: var(--orange-main);
    }

    .autocomplete-box {
      background: #18181f;
      border: 1px solid var(--orange-main);
      border-radius: 8px;
      max-height: 165px;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }

    .autocomplete-item {
      padding: 0.55rem 0.85rem;
      font-size: 0.86rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .autocomplete-item:hover {
      background: rgba(255, 77, 0, 0.22);
    }

    .add-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .inscritos-list {
      list-style: none;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .inscrito-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.6rem 0.8rem;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 600;
      gap: 0.5rem;
    }

    .inscrito-contact-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 0.15rem;
    }

    .btn-del-mini {
      background: transparent;
      border: none;
      color: #f87171;
      font-weight: 800;
      cursor: pointer;
      padding: 0.2rem 0.45rem;
    }

    /* MARCADOR EN VIVO (CONTROL) */
    .scoreboard-box {
      background: linear-gradient(145deg, #141418 0%, #09090b 100%);
      border: 2px solid var(--orange-main);
      border-radius: 16px;
      padding: 1.35rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 12px 35px rgba(255, 77, 0, 0.2);
    }

    .sb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .sb-round-badge {
      background: var(--orange-main);
      color: #000;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      padding: 0.25rem 0.8rem;
      border-radius: 6px;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .record-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 77, 0, 0.5);
      color: #fff;
      padding: 0.3rem 0.85rem;
      border-radius: 8px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .record-pill span {
      color: var(--orange-main);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .timer-display {
      text-align: center;
      margin: 0.5rem 0 1.25rem;
    }

    .timer-digits {
      font-family: 'Anton', sans-serif;
      font-size: 4rem;
      letter-spacing: 3px;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 77, 0, 0.4);
    }

    .timer-digits.danger {
      color: #ef4444;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.45; }
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .versus-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1rem;
      align-items: center;
      margin-top: 1rem;
    }

    @media (max-width: 640px) {
      .versus-grid { grid-template-columns: 1fr; }
    }

    .team-score-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 1.1rem;
      text-align: center;
    }

    .team-name {
      font-family: 'Oswald', sans-serif;
      font-size: 1.5rem;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      word-break: break-word;
    }

    .team-pts {
      font-family: 'Anton', sans-serif;
      font-size: 4.5rem;
      color: var(--orange-main);
      line-height: 1;
      margin: 0.4rem 0 0.9rem;
    }

    .pts-buttons {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .btn-pt {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      min-width: 66px;
    }

    .btn-pt-1 { background: #fff; color: #000; }
    .btn-pt-2 { background: var(--orange-main); color: #000; }
    .btn-pt-minus { background: rgba(255,255,255,0.14); color: #fff; }

    .vs-divider {
      font-family: 'Anton', sans-serif;
      font-size: 2rem;
      color: var(--text-muted);
      text-align: center;
    }

    .match-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .match-card.active-match {
      border-color: var(--orange-main);
      background: rgba(255, 77, 0, 0.12);
    }

    .match-card.done-match {
      opacity: 0.78;
      border-left: 4px solid var(--green-win);
    }

    .match-card.dq-match {
      opacity: 0.78;
      border-left: 4px solid #ef4444;
      background: rgba(220, 38, 38, 0.08);
    }

    .match-card.repechaje-match {
      border-left: 4px solid var(--gold-chosen);
      background: rgba(250, 204, 21, 0.07);
    }

    /* Tabla Triples & Historial */
    .triples-table {
      width: 100%;
      border-collapse: collapse;
    }

    .triples-table th, .triples-table td {
      padding: 0.75rem 0.6rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.88rem;
    }

    .triples-table th {
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .row-shooter-active {
      background: rgba(255, 77, 0, 0.16);
      outline: 1px solid var(--orange-main);
    }

    .champion-banner {
      background: linear-gradient(90deg, rgba(255,77,0,0.25), rgba(34,197,94,0.25));
      border: 2px solid var(--green-win);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .champion-banner h3 {
      font-family: 'Anton', sans-serif;
      font-size: 2.2rem;
      color: #4ade80;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* MODAL DE SEGURIDAD */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      padding: 1rem;
    }

    .modal-card {
      background: #141418;
      border: 2px solid #ef4444;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 1.75rem;
      box-shadow: 0 20px 60px rgba(239, 68, 68, 0.35);
      text-align: center;
    }

    .modal-card h3 {
      font-family: 'Anton', sans-serif;
      font-size: 1.9rem;
      color: #f87171;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.65rem;
    }

    .math-challenge-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem 0;
    }

    .math-question {
      font-family: 'Anton', sans-serif;
      font-size: 2.2rem;
      color: var(--gold-chosen);
      letter-spacing: 2px;
      margin: 0.4rem 0 0.8rem;
    }

    .math-challenge-box input {
      width: 140px;
      text-align: center;
      font-family: 'Anton', sans-serif;
      font-size: 1.6rem;
      padding: 0.5rem;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background: #09090b;
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 1.15rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
      background: rgba(9, 9, 11, 0.9);
    }

    /* ================= ADAPTABILIDAD MÓVIL (TELÉFONOS) ================= */
    @media (max-width: 820px) {
      body {
        padding-top: 0 !important;
      }

      header {
        position: relative !important;
        height: auto !important;
        flex-direction: column;
        align-items: stretch;
        padding: 0.85rem 1rem;
        gap: 0.8rem;
      }

      .brand-left {
        justify-content: space-between;
        width: 100%;
      }

      .logo-rk-img {
        height: 46px;
      }

      .rk-subtitle {
        font-size: 0.72rem;
        padding-left: 0.55rem;
      }

      .brand-right {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        width: 100%;
      }

      .brand-right button {
        width: 100%;
        padding: 0.55rem 0.5rem;
        font-size: 0.8rem;
      }

      .tf-credit-group {
        grid-column: 1 / -1;
        justify-content: center;
        padding-top: 0.45rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .created-by-label {
        display: block;
        text-align: right;
        font-size: 0.65rem;
      }

      .logo-tf-img {
        height: 42px;
      }

      main {
        padding: 1.1rem 0.9rem;
      }
    }
